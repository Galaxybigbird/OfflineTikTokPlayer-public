name: Verify smooth A/V sync, picture continuity and recovery
on:
  push:
    branches: [codex/smooth-video-fix]
permissions:
  contents: read
jobs:
  portable:
    if: github.repository == 'Galaxybigbird/OfflineTikTokPlayer-public' && !github.event.repository.private
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify audio engine and frame-request baselines stayed untouched
        run: |
          set -euo pipefail
          base=7d30dccbdaf8d909c1076c26e300f79bff3192ad
          git diff --exit-code "$base" HEAD -- \
            ios/OfflineTikTokPlayer/Playback/ContinuousAudioPlayer.swift \
            ios/OfflineTikTokPlayer/Playback/ContinuousAudioGraph.swift \
            ios/PlayerCore/Sources/PlayerCore/ContinuousPCMRenderer.swift \
            ios/PlayerCore/Sources/PlayerCore/VideoFrameRequest.swift \
            scripts/private-delivery.py
      - name: Check project, Swift syntax and playback core
        run: |
          set -euo pipefail
          python3 -B scripts/generate-ios-project.py --check
          python3 -B tests/validation-shell/test_simulator_boot_preflight.py
          python3 -B tests/validation-shell/test_simulator_destination_resolution.py
          swiftc -frontend -parse -D DEBUG \
            ios/OfflineTikTokPlayer/App/{AppModel,OfflineTikTokPlayerApp}.swift \
            ios/OfflineTikTokPlayer/Playback/{ContinuousAudioPlayer,ContinuousPictureInPicture,IsolatedVideoRecovery,PlaybackBuffer,PlaybackService,StreamingVideoFrames}.swift \
            ios/OfflineTikTokPlayerTests/{AudioOnlyContinuityTests,ContinuousAudioPlayerTests,ContinuousPictureInPictureTests,NativeMediaTests,NativeStreamingPlaybackTests,PictureRecoveryTests,PlaybackContinuityTests,PlaybackSelectionVideoRegressionTests,StreamingVideoFramesTests,VideoPresentationContinuityTests}.swift \
            ios/OfflineTikTokPlayerUITests/PlayerShellTests.swift
          bash scripts/test-core.sh
          bash scripts/test-native-cloud.sh
  simulator:
    if: github.repository == 'Galaxybigbird/OfflineTikTokPlayer-public' && !github.event.repository.private
    needs: portable
    runs-on: macos-26
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify smooth A/V sync, framerate cadence and recovery on simulator
        run: |
          set -euo pipefail
          udid="$(python3 -B scripts/capture-simulator-test-frames.py --hosted-inventory --resolve-destination 'platform=iOS Simulator,name=iPhone 17 Pro Max')"
          [[ "$udid" =~ ^[0-9a-fA-F-]{36}$ ]]
          work=artifacts/loop-picture
          mkdir -p "$work"
          capture_pid=''
          cleanup_capture() {
            if [ -n "$capture_pid" ]; then
              kill "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
              capture_pid=''
            fi
          }
          trap cleanup_capture EXIT
          recovery=OfflineTikTokPlayerTests/PictureRecoveryTests
          continuity=OfflineTikTokPlayerTests/VideoPresentationContinuityTests
          pip=OfflineTikTokPlayerTests/ContinuousPictureInPictureTests
          resources=OfflineTikTokPlayerTests/ContinuousPictureInPictureResourceTests
          streaming=OfflineTikTokPlayerTests/NativeStreamingPlaybackTests
          frames=OfflineTikTokPlayerTests/StreamingVideoFramesTests
          selection=OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests
          boot_simulator() {
            if ! python3 -B scripts/ensure-simulator-booted.py --udid "$udid" --hosted-inventory; then
              echo "::warning title=boot_simulator::First simulator boot attempt failed; shutting down and retrying once"
              xcrun simctl shutdown "$udid" 2>/dev/null || true
              python3 -B scripts/ensure-simulator-booted.py --udid "$udid" --hosted-inventory || {
                echo "::error title=boot_simulator::Simulator boot failed after retry"
                return 1
              }
            fi
          }
          start_capture() {
            local capture_log="$work/capture-helper.log"
            python3 -u scripts/capture-simulator-test-frames.py \
              --udid "$udid" --lifetime 1200 >"$capture_log" 2>&1 &
            capture_pid=$!
            for ((attempt=0; attempt<100; attempt++)); do
              kill -0 "$capture_pid" 2>/dev/null || { cat "$capture_log"; return 1; }
              if grep -Fq '"eventCode": 0' "$capture_log"; then return 0; fi
              sleep 0.1
            done
            cat "$capture_log"
            return 1
          }
          build_cases() {
            local phase="$1" project="${2:-ios/OfflineTikTokPlayer.xcodeproj}" derived="${3:-$work/Derived}"
            if ! xcodebuild build-for-testing -project "$project" -scheme OfflineTikTokPlayer \
              -configuration Debug -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$derived" -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/$work/Derived/SourcePackages" \
              -jobs 2 CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$work/$phase-build.log"; then
              grep -i "error:" "$work/$phase-build.log" | head -n 10 | while IFS= read -r line; do
                echo "::error title=build::$line"
              done || true
              return 1
            fi
            local plans=("$derived/Build/Products/"*.xctestrun)
            test "${#plans[@]}" = 1 && test -f "${plans[0]}" || return
            plan="${plans[0]}"
          }
          run_cases() {
            local phase="$1" selector
            shift
            local args=()
            for selector in "$@"; do args+=("-only-testing:$selector"); done
            run_once() {
              xcodebuild test-without-building -xctestrun "$plan" -destination "platform=iOS Simulator,id=$udid" \
                -resultBundlePath "$work/$phase.xcresult" -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 90 \
                "${args[@]}" 2>&1 | tee "$work/$phase.log"
            }
            local status=0
            run_once || status=$?
            if (( status != 0 )) \
              && grep -Fq 'operation never finished bootstrapping' "$work/$phase.log" \
              && ! grep -Eq 'Test Case .* started' "$work/$phase.log"; then
              echo "Restarting the test simulator once after a pre-test bootstrap abort."
              mv "$work/$phase.log" "$work/$phase-bootstrap.log" || return
              if [[ -d "$work/$phase.xcresult" ]]; then
                mv "$work/$phase.xcresult" "$work/$phase-bootstrap.xcresult" || return
              fi
              local had_capture="$capture_pid"
              cleanup_capture
              xcrun simctl shutdown "$udid" || return
              boot_simulator || return
              if [[ -n "$had_capture" ]]; then start_capture || return; fi
              status=0
              run_once || status=$?
            fi
            return "$status"
          }
          check_cases() {
            local phase="$1" result="$2"
            shift 2
            if [[ ! -d "$work/$phase.xcresult" ]]; then
              echo "::error title=$phase::Missing xcresult bundle"
              return 1
            fi
            xcrun xcresulttool get test-results tests --path "$work/$phase.xcresult" > "$work/$phase.json"
            python3 - "$work/$phase.json" "$result" "$phase" "$@" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, result, phase, *selectors = sys.argv[1:]
          expected = {selector.split('/', 1)[1] for selector in selectors}
          failures = []
          nodes = list(json.loads(Path(report).read_text())['testNodes'])
          while nodes:
              node = nodes.pop()
              children = node.get('children', ())
              nodes.extend(children)
              if node['nodeType'] == 'Test Case':
                  identity = node['nodeIdentifier'].removesuffix('()')
                  if identity not in expected:
                      failures.append(f"unexpected {identity}")
                      continue
                  expected.remove(identity)
                  if node['result'] != result:
                      details = []
                      stack = list(children)
                      while stack:
                          child = stack.pop()
                          stack.extend(child.get('children', ()))
                          if child.get('nodeType') == 'Failure Message' and child.get('name'):
                              details.append(child['name'].replace('\n', ' '))
                      msg = '; '.join(details[:3]) or node['result']
                      failures.append(f"{identity}: {msg}")
          for missing in sorted(expected):
              failures.append(f"missing {missing}")
          for entry in failures:
              print(f"::error title={phase}::{entry[:300]}")
          assert not failures, failures
          print(Path(report).stem, result, len(selectors))
          PY
          }
          run_checked() {
            local phase="$1"
            shift
            local rc=0
            run_cases "$phase" "$@" || rc=$?
            if [[ -f "$work/$phase.log" ]]; then
              grep -E '(SMOOTH_SEEK_TEST|MODERATE_DRIFT_TEST|REAL_TIKTOK_24FPS|PRODUCTION_HD deliveredFPS|VIDEO_PRESENTATION |HTTP_PICTURE_BRIDGE|LOCAL_PICTURE_BRIDGE|AFTER_LOOP_HD)' "$work/$phase.log" | head -n 16 | while IFS= read -r line; do
                echo "::notice title=$phase::${line:0:300}"
              done || true
            fi
            check_cases "$phase" Passed "$@" || rc=1
            return "$rc"
          }
          boot_simulator
          build_cases Fixed
          gate_status=0
          # Run smooth A/V sync & real-TikTok-profile proofs first (also warming the simulator host),
          # then measure full-resolution 1080p60 cadence and streaming/continuity without capture overhead,
          # then run compositor-captured recovery & selection proofs.
          run_checked SmoothSync \
            "$recovery/testSlowHardwareSeekResumesSmoothlyWithoutSeekLoop" \
            "$recovery/testModerateDriftRateMatchesSmoothlyWithoutSeeking" \
            "$recovery/testRealTikTokProfile24FPSWithAudioTailStaysNativeAndSmoothWithoutAlternatePolling" \
            "$recovery/testMissingItemSamplesUseOriginalLocalFramesWhileAudioAdvances" || gate_status=1
          run_checked ProductionHDAndContinuity \
            "$recovery/testFullResolutionProductionPlaybackKeepsVideoAndAudioMoving" \
            "$continuity/testNativeClockLeadInsideDriftToleranceStillProducesDisplayableFrames" \
            "$continuity/testShortTrailingAudioKeepsNativeVideoAndAFreshLastFrameWhilePaused" \
            "$continuity/testRendererDrainsStaleQueuedFramesWhileTheCurrentVideoKeepsPlaying" \
            "$continuity/testRunningDisplayLinkOwnsVideoPullsDuringProgressAndPresentationUpdates" \
            "$pip/testSwitchingFrameRatesRequestsAdaptiveTimingForEachSelectedClip" \
            "$pip/testNativeVideoGeometryRequiresSquareFullIntegralIdentityDescriptions" \
            "$resources/testOffscreenPreparationInstallsActualGeometryAndSingleStagedOutput" \
            "$streaming/testHTTPPlaybackWarmsTemporaryFilesAndKeepsNavigationAndRepeatOnOneGraph" \
            "$streaming/testReturningToAHealthyNativeStreamDoesNotRestartItsPicture" \
            "$frames/testLoopbackFramesFollowTheCurrentQueueItemWithoutAnItemVideoOutput" || gate_status=1
          start_capture
          run_checked CoreRecoveryAndSelection \
            "$recovery/testMovingPictureRecoversBeforeHalfASecondWhileAudioAdvances" \
            "$recovery/testPictureFeedRecoversTwiceWithinTheSamePlayingVisit" \
            "$recovery/testNativeAudioOwnerRecoversAgainAfterPauseWithoutSeekingTheAudiblePlayer" \
            "$recovery/testRepeatedLoopsAndRapidReversalsKeepDisplayingTheCurrentVideo" \
            "$selection/testIssuedVideoSeekCompletionCannotActivateStaleABeforeNaturalBVisitAdoption" \
            "$selection/testRapidABASupersedesPendingVideoSeekAndPreservesExplicitPause" || gate_status=1
          exit "$gate_status"
